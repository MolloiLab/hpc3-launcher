name: package smoke-test

# Proves the packaged app ACTUALLY LAUNCHES on macOS, Windows and Linux -- the
# class of failure the old Windows build hit (it built fine but wouldn't run).
#
# Each job builds the real PyInstaller payload that ships inside the installer
# (the .app on macOS, the dist folder zipped on Windows, the dist folder packed
# into the .deb on Linux) and then runs that frozen binary headlessly with
# HPC3_SMOKE_TEST=1 + QT_QPA_PLATFORM=offscreen. The app builds its full main
# window, confirms the Qt event loop starts and writes a marker file; the job
# passes only if the marker says "SMOKE OK". No login, network or release is
# involved -- it's a pure "does the package run on a clean machine?" check.
#
# Runs on demand (Actions -> "package smoke-test" -> Run workflow) and on PRs
# that touch the app or the build, so a package that can't run is caught before
# it ever reaches a release. The release workflow additionally re-downloads the
# PUBLISHED installer and launch-tests that, see release.yml (verify-* jobs).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "hpc3_launcher/**"
      - "requirements.txt"
      - ".github/workflows/smoke-test.yml"

env:
  PY_VERSION: "3.11"

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          # setuptools >=71 vendors backports.tarfile, which PyInstaller's
          # pkg_resources runtime hook fails to collect ("No module named
          # 'backports'" at launch). Pin below that so the frozen app starts.
          pip install "setuptools<71"
      - name: Build .app
        run: |
          python -m PyInstaller --noconfirm --windowed --name "HPC3-Launcher" \
            --paths hpc3_launcher \
            --add-data "hpc3_launcher/resources:resources" \
            --hidden-import paramiko --hidden-import pexpect \
            --hidden-import cryptography --hidden-import bcrypt --hidden-import nacl \
            --hidden-import requests --hidden-import packaging --hidden-import packaging.version \
            --hidden-import PyQt5 --hidden-import PyQt5.QtWidgets \
            --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtGui \
            --osx-bundle-identifier edu.uci.hpc3launcher \
            --icon hpc3_launcher/resources/icon.icns \
            hpc3_launcher/main.py
      - name: Launch packaged app headless
        run: |
          set -euo pipefail
          export HPC3_SMOKE_TEST=1 HPC3_SMOKE_MARKER="$PWD/marker.txt" QT_QPA_PLATFORM=offscreen
          ( ./dist/HPC3-Launcher.app/Contents/MacOS/HPC3-Launcher & APP=$!; \
            for i in $(seq 1 30); do kill -0 $APP 2>/dev/null || break; sleep 1; done; \
            kill -9 $APP 2>/dev/null || true ) || true
          if grep -q "SMOKE OK" marker.txt 2>/dev/null; then
            echo "PASS (macOS): $(cat marker.txt)"
          else
            echo "FAIL (macOS): packaged app did not reach the Qt event loop"; exit 1
          fi

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          # setuptools >=71 vendors backports.tarfile, which PyInstaller's
          # pkg_resources runtime hook fails to collect ("No module named
          # 'backports'" at launch). Pin below that so the frozen app starts.
          pip install "setuptools<71"
      - name: Build .exe
        run: |
          python -m PyInstaller --noconfirm --windowed --name "HPC3-Launcher" `
            --paths hpc3_launcher `
            --add-data "hpc3_launcher/resources;resources" `
            --hidden-import paramiko --hidden-import pexpect `
            --hidden-import cryptography --hidden-import bcrypt --hidden-import nacl `
            --hidden-import requests --hidden-import packaging --hidden-import packaging.version `
            --hidden-import PyQt5 --hidden-import PyQt5.QtWidgets `
            --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtGui `
            --icon hpc3_launcher/resources/icon.ico `
            hpc3_launcher/main.py
      - name: Launch packaged app headless
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:HPC3_SMOKE_TEST = "1"
          $env:HPC3_SMOKE_MARKER = "$PWD\marker.txt"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\HPC3-Launcher\HPC3-Launcher.exe" -PassThru
          try { Wait-Process -Id $p.Id -Timeout 60 } catch { }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ((Test-Path marker.txt -PathType Leaf) -and ((Get-Content marker.txt -Raw) -match "SMOKE OK")) {
            Write-Host "PASS (Windows): $(Get-Content marker.txt -Raw)"
          } else {
            Write-Host "FAIL (Windows): packaged app did not reach the Qt event loop"; exit 1
          }

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libgl1 libegl1 libglib2.0-0 \
            libfontconfig1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          # setuptools >=71 vendors backports.tarfile, which PyInstaller's
          # pkg_resources runtime hook fails to collect ("No module named
          # 'backports'" at launch). Pin below that so the frozen app starts.
          pip install "setuptools<71"
      - name: Build binary
        run: |
          python -m PyInstaller --noconfirm --windowed --name "HPC3-Launcher" \
            --paths hpc3_launcher \
            --add-data "hpc3_launcher/resources:resources" \
            --hidden-import paramiko --hidden-import pexpect \
            --hidden-import cryptography --hidden-import bcrypt --hidden-import nacl \
            --hidden-import requests --hidden-import packaging --hidden-import packaging.version \
            --hidden-import PyQt5 --hidden-import PyQt5.QtWidgets \
            --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtGui \
            --icon hpc3_launcher/resources/icon.png \
            hpc3_launcher/main.py
      - name: Launch packaged app headless
        run: |
          set -euo pipefail
          export HPC3_SMOKE_TEST=1 HPC3_SMOKE_MARKER="$PWD/marker.txt" QT_QPA_PLATFORM=offscreen
          ( ./dist/HPC3-Launcher/HPC3-Launcher & APP=$!; \
            for i in $(seq 1 30); do kill -0 $APP 2>/dev/null || break; sleep 1; done; \
            kill -9 $APP 2>/dev/null || true ) || true
          if grep -q "SMOKE OK" marker.txt 2>/dev/null; then
            echo "PASS (Linux): $(cat marker.txt)"
          else
            echo "FAIL (Linux): packaged app did not reach the Qt event loop"; exit 1
          fi
