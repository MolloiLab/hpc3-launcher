name: build-release

# Builds installers and attaches them to a GitHub Release.
# Fires automatically when release-please publishes a release; can also be run
# by hand against an existing tag via the "Run workflow" button.
#
# macOS signing is progressive:
#   * no secrets  -> ad-hoc signature (works; user runs a one-line quarantine fix,
#                    see README "Installing on macOS").
#   * Developer ID secrets present -> real Developer ID signature + notarization,
#                    so the app opens with zero warnings. Add these repo secrets:
#       MACOS_DEVELOPER_ID          e.g. "Developer ID Application: Name (TEAMID)"
#       MACOS_CERTIFICATE_P12       base64 of the exported .p12
#       MACOS_CERTIFICATE_PASSWORD  password used when exporting the .p12
#       MACOS_NOTARY_APPLE_ID       Apple ID email
#       MACOS_NOTARY_TEAM_ID        10-char Team ID
#       MACOS_NOTARY_PASSWORD       app-specific password (appleid.apple.com)
#
# Windows signing is progressive too:
#   * no secrets  -> unsigned (works; user clicks "More info -> Run anyway" once,
#                    see README "Installing on Windows").
#   * Azure Trusted Signing secrets present -> Authenticode-signed exe + installer
#                    (no SmartScreen warning). Add these repo secrets (see
#                    docs/SIGNING.md for the ~$10/mo setup):
#       AZURE_TENANT_ID  AZURE_CLIENT_ID  AZURE_CLIENT_SECRET
#       TRUSTED_SIGNING_ENDPOINT       e.g. https://wus2.codesigning.azure.net
#       TRUSTED_SIGNING_ACCOUNT        Trusted Signing account name
#       TRUSTED_SIGNING_CERT_PROFILE   certificate profile name

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build & attach to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PY_VERSION: "3.11"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          # setuptools >=71 vendors backports.tarfile, which PyInstaller's
          # pkg_resources runtime hook fails to collect ("No module named
          # 'backports'" at launch). Pin below that so the frozen app starts.
          pip install "setuptools<71"
      - name: Build .app
        run: |
          python -m PyInstaller --noconfirm --windowed --name "HPC3-Launcher" \
            --paths hpc3_launcher \
            --add-data "hpc3_launcher/resources:resources" \
            --hidden-import paramiko --hidden-import pexpect \
            --hidden-import cryptography --hidden-import bcrypt --hidden-import nacl \
            --hidden-import requests --hidden-import packaging --hidden-import packaging.version \
            --hidden-import PyQt5 --hidden-import PyQt5.QtWidgets \
            --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtGui \
            --osx-bundle-identifier edu.uci.hpc3launcher \
            --icon hpc3_launcher/resources/icon.icns \
            hpc3_launcher/main.py
      - name: Sign app (Developer ID if available, else ad-hoc)
        env:
          DEVID: ${{ secrets.MACOS_DEVELOPER_ID }}
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          APP="dist/HPC3-Launcher.app"
          if [ -n "$CERT_P12" ] && [ -n "$DEVID" ]; then
            echo "Signing with Developer ID"
            KC=build.keychain; KCPWD=$(uuidgen)
            security create-keychain -p "$KCPWD" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPWD" "$KC"
            echo "$CERT_P12" | base64 --decode > cert.p12
            security import cert.p12 -k "$KC" -P "$CERT_PWD" -T /usr/bin/codesign
            security list-keychains -d user -s "$KC" login.keychain
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPWD" "$KC"
            codesign --force --deep --options runtime --timestamp --sign "$DEVID" "$APP"
            rm -f cert.p12
          else
            echo "No Developer ID secrets -> ad-hoc signature"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --verbose=2 "$APP" || true
      - name: Build DMG (+ notarize if creds present)
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PWD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          python create_dmg.py
          DMG=$(ls HPC3-Launcher-*-macos.dmg | head -1)
          if [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PWD" ]; then
            echo "Notarizing $DMG"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" --password "$APP_PWD" --wait
            xcrun stapler staple "$DMG"
          else
            echo "No notarization creds -> shipping ad-hoc DMG (see README install steps)"
          fi
      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" HPC3-Launcher-*-macos.dmg --clobber

  windows:
    runs-on: windows-latest
    env:
      # With Azure Trusted Signing secrets set, the exe + installer are
      # Authenticode-signed (no SmartScreen warning). Without them they ship
      # unsigned and users click "More info -> Run anyway" once (see README).
      HAS_WIN_SIGNING: ${{ secrets.TRUSTED_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          # setuptools >=71 vendors backports.tarfile, which PyInstaller's
          # pkg_resources runtime hook fails to collect ("No module named
          # 'backports'" at launch). Pin below that so the frozen app starts.
          pip install "setuptools<71"
      - name: Build .exe
        run: |
          python -m PyInstaller --noconfirm --windowed --name "HPC3-Launcher" `
            --paths hpc3_launcher `
            --add-data "hpc3_launcher/resources;resources" `
            --hidden-import paramiko --hidden-import pexpect `
            --hidden-import cryptography --hidden-import bcrypt --hidden-import nacl `
            --hidden-import requests --hidden-import packaging --hidden-import packaging.version `
            --hidden-import PyQt5 --hidden-import PyQt5.QtWidgets `
            --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtGui `
            --icon hpc3_launcher/resources/icon.ico `
            hpc3_launcher/main.py
      - name: Sign app (Azure Trusted Signing if configured)
        if: env.HAS_WIN_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\HPC3-Launcher
          files-folder-filter: exe
          files-folder-recurse: true
      - name: Build installer (Inno Setup)
        run: |
          # Inno Setup turns the PyInstaller one-folder build into a single
          # download-and-run setup.exe (the Windows analog of the macOS .dmg).
          # The installer is per-user (no admin) -- see windows-installer.iss.
          choco install innosetup --no-progress -y
          $ver = $env:TAG -replace '^v',''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & "$iscc" "/DAppVersion=$ver" windows-installer.iss
      - name: Sign installer (Azure Trusted Signing if configured)
        if: env.HAS_WIN_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          files-folder-recurse: false
      - name: Attach installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:TAG -replace '^v',''
          gh release upload "$env:TAG" "HPC3-Launcher-$ver-windows-setup.exe" --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libgl1 fakeroot
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          # setuptools >=71 vendors backports.tarfile, which PyInstaller's
          # pkg_resources runtime hook fails to collect ("No module named
          # 'backports'" at launch). Pin below that so the frozen app starts.
          pip install "setuptools<71"
      - name: Build + package .deb
        run: |
          python -m PyInstaller --noconfirm --windowed --name "HPC3-Launcher" \
            --paths hpc3_launcher \
            --add-data "hpc3_launcher/resources:resources" \
            --hidden-import paramiko --hidden-import pexpect \
            --hidden-import cryptography --hidden-import bcrypt --hidden-import nacl \
            --hidden-import requests --hidden-import packaging --hidden-import packaging.version \
            --hidden-import PyQt5 --hidden-import PyQt5.QtWidgets \
            --hidden-import PyQt5.QtCore --hidden-import PyQt5.QtGui \
            --icon hpc3_launcher/resources/icon.png \
            hpc3_launcher/main.py
          VERSION="${TAG#v}"
          PKG=dist/deb-package
          mkdir -p $PKG/DEBIAN $PKG/usr/local/bin $PKG/usr/share/applications \
                   $PKG/usr/share/icons/hicolor/256x256/apps
          cp -r dist/HPC3-Launcher/* $PKG/usr/local/bin/
          cp hpc3_launcher/resources/icon.png $PKG/usr/share/icons/hicolor/256x256/apps/hpc3-launcher.png
          cat > $PKG/usr/share/applications/hpc3-launcher.desktop <<EOF
          [Desktop Entry]
          Name=HPC3 Launcher
          Comment=Launch and manage UCI HPC3 jobs, nodes, VSCode sessions and SU balance
          Exec=/usr/local/bin/HPC3-Launcher
          Icon=/usr/share/icons/hicolor/256x256/apps/hpc3-launcher.png
          Terminal=false
          Type=Application
          Categories=Utility;Science;
          EOF
          cat > $PKG/DEBIAN/control <<EOF
          Package: hpc3-launcher
          Version: ${VERSION:-0.0.0}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgl1
          Maintainer: Molloi Lab
          Description: HPC3 Launcher
           A desktop launcher for UCI's HPC3 cluster: jobs, nodes, VSCode remote
           sessions and SU balance.
          EOF
          fakeroot dpkg-deb --build $PKG "HPC3-Launcher-${VERSION:-0.0.0}-linux.deb"
      - name: Attach .deb to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" HPC3-Launcher-*-linux.deb --clobber

  # ---- Verification: download the PUBLISHED installer for each OS and actually
  # launch it headlessly, proving the distributed package runs on a clean machine
  # (the class of failure the Windows build used to hit). Each job downloads the
  # asset just uploaded above, installs/extracts it exactly as a user would, then
  # runs the frozen binary with HPC3_SMOKE_TEST=1 + QT_QPA_PLATFORM=offscreen.
  # The app builds its full main window, confirms the Qt event loop starts, and
  # writes a marker file; the job passes only if that marker says "SMOKE OK".

  verify-macos:
    needs: macos
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download published DMG, mount and launch headless
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "HPC3-Launcher-*-macos.dmg" --clobber
          DMG=$(ls HPC3-Launcher-*-macos.dmg | head -1)
          echo "Mounting $DMG"
          hdiutil attach "$DMG" -mountpoint mnt -nobrowse -quiet
          cp -R "mnt/HPC3-Launcher.app" ./HPC3-Launcher.app
          hdiutil detach mnt -quiet
          xattr -dr com.apple.quarantine ./HPC3-Launcher.app || true
          export HPC3_SMOKE_TEST=1 HPC3_SMOKE_MARKER="$PWD/marker.txt" QT_QPA_PLATFORM=offscreen
          ( ./HPC3-Launcher.app/Contents/MacOS/HPC3-Launcher & APP=$!; \
            for i in $(seq 1 30); do kill -0 $APP 2>/dev/null || break; sleep 1; done; \
            kill -9 $APP 2>/dev/null || true ) || true
          if grep -q "SMOKE OK" marker.txt 2>/dev/null; then
            echo "PASS (macOS): $(cat marker.txt)"
          else
            echo "FAIL (macOS): packaged app did not reach the Qt event loop"; exit 1
          fi

  verify-windows:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download published installer, install silently and launch headless
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force verify | Out-Null
          Set-Location verify
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" -p "HPC3-Launcher-*-windows-setup.exe" --clobber
          $setup = Get-ChildItem "HPC3-Launcher-*-windows-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer not found in release assets" }
          Write-Host "Installing $($setup.Name) silently"
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # Per-user (PrivilegesRequired=lowest) installs to %LocalAppData%\Programs;
          # also check Program Files in case a future build switches to a machine install.
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs\HPC3 Launcher","$env:ProgramFiles\HPC3 Launcher","${env:ProgramFiles(x86)}\HPC3 Launcher" `
                   -Filter HPC3-Launcher.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "HPC3-Launcher.exe not found after install" }
          $env:HPC3_SMOKE_TEST = "1"
          $env:HPC3_SMOKE_MARKER = "$PWD\marker.txt"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          try { Wait-Process -Id $p.Id -Timeout 60 } catch { }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ((Test-Path marker.txt -PathType Leaf) -and ((Get-Content marker.txt -Raw) -match "SMOKE OK")) {
            Write-Host "PASS (Windows): $(Get-Content marker.txt -Raw)"
          } else {
            Write-Host "FAIL (Windows): packaged app did not reach the Qt event loop"; exit 1
          }

  verify-linux:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download published .deb, install and launch headless
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libdbus-1-3
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "HPC3-Launcher-*-linux.deb" --clobber
          DEB=$(ls HPC3-Launcher-*-linux.deb | head -1)
          sudo apt-get install -y "./$DEB"
          export HPC3_SMOKE_TEST=1 HPC3_SMOKE_MARKER="$PWD/marker.txt" QT_QPA_PLATFORM=offscreen
          ( /usr/local/bin/HPC3-Launcher & APP=$!; \
            for i in $(seq 1 30); do kill -0 $APP 2>/dev/null || break; sleep 1; done; \
            kill -9 $APP 2>/dev/null || true ) || true
          if grep -q "SMOKE OK" marker.txt 2>/dev/null; then
            echo "PASS (Linux): $(cat marker.txt)"
          else
            echo "FAIL (Linux): packaged app did not reach the Qt event loop"; exit 1
          fi

  # ---- The release page itself. Everything above proves the installers work;
  # this turns the release into something a lab member can actually act on:
  # which file to download, what each OS will complain about on first launch, and
  # what to do about it. It runs AFTER the verify jobs, so a guide is only ever
  # appended to a release whose installers have been launch-tested.
  #
  # The guide adapts to how the build was signed. Signing here is progressive (see
  # the header of this file), so telling every user to run `xattr` when the DMG is
  # actually notarized would be wrong -- and worse, would train them to disable
  # protections they don't need to.
  release-notes:
    name: release install guide
    needs: [verify-macos, verify-windows, verify-linux]
    runs-on: ubuntu-latest
    env:
      MAC_SIGNED: ${{ secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_DEVELOPER_ID != '' }}
      WIN_SIGNED: ${{ secrets.TRUSTED_SIGNING_ENDPOINT != '' }}
    steps:
      - name: Append install guide to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md

          # Drop a guide left by an earlier run so re-running UPDATES it in place
          # instead of appending a second copy or skipping. The marker is an HTML
          # comment rather than a heading, so rewording headings can't strand an
          # old guide on the page forever.
          awk '/^<!-- install-guide -->$/{exit} {print}' notes.md > trimmed.md
          # Drop trailing blank lines too, or the guide's leading blank line would
          # accumulate one more every time this job re-runs against the same release.
          awk 'NF{last=NR} {line[NR]=$0} END{for (i=1; i<=last; i++) print line[i]}' \
            trimmed.md > notes.md

          cat >> notes.md <<'EOF'

          <!-- install-guide -->
          ## Install

          Download one file for your platform, from **Assets** at the bottom of this page.
          Nothing else is needed — Python, Qt and the SSH tooling are bundled.

          | Platform | Download | Admin rights |
          |----------|----------|--------------|
          | macOS 11+ (Apple Silicon or Intel) | `HPC3-Launcher-__VER__-macos.dmg` | not needed |
          | Windows 10/11 (64-bit) | `HPC3-Launcher-__VER__-windows-setup.exe` | not needed |
          | Debian / Ubuntu (64-bit) | `HPC3-Launcher-__VER__-linux.deb` | needed, for `dpkg` |

          ### Before you start

          - Your **UCInetID** and password, and **Duo** on your phone.
          - **Off campus? Connect to the UCI VPN first.** HPC3 is not reachable from the open
            internet, so without it the app reports that it can't reach the cluster.
          EOF

          # ---- macOS ---------------------------------------------------------
          if [ "$MAC_SIGNED" = "true" ]; then
            cat >> notes.md <<'EOF'

          ### macOS

          Open the `.dmg`, drag **HPC3-Launcher** into **Applications**, and open it. This build is
          signed with an Apple Developer ID and notarized, so there are no warnings and no Terminal
          steps.
          EOF
          else
            cat >> notes.md <<'EOF'

          ### macOS

          1. Open the `.dmg` and drag **HPC3-Launcher** into **Applications**. No admin rights? Drag
             it into `~/Applications` in your home folder instead (create that folder if it doesn't
             exist) — it runs exactly the same.
          2. This build is **not yet notarized by Apple**, so clear the download quarantine once.
             In **Terminal**:

             ```sh
             xattr -dr com.apple.quarantine "/Applications/HPC3-Launcher.app"
             ```

             Used `~/Applications`? Put that path in the command instead.
          3. Open **HPC3-Launcher** from Applications normally.

          <details>
          <summary>Prefer not to use Terminal?</summary>

          Double-click the app and let macOS block it. Then open **System Settings → Privacy &
          Security**, scroll to the message about HPC3-Launcher, and click **Open Anyway**. Open the
          app again and choose **Open**.
          </details>

          <details>
          <summary>It says HPC3-Launcher "is damaged and can't be opened"</summary>

          Nothing is damaged. That is macOS's generic wording for an app that isn't signed with a
          paid Developer ID, and on Apple Silicon clearing quarantine alone is sometimes not enough.
          Re-sign the app locally and it opens:

          ```sh
          codesign --force --deep --sign - "/Applications/HPC3-Launcher.app"
          ```
          </details>

          The quarantine step disappears once the project has an Apple Developer ID — see
          [`docs/SIGNING.md`](https://github.com/MolloiLab/hpc3-launcher/blob/main/docs/SIGNING.md).
          EOF
          fi

          # ---- Windows -------------------------------------------------------
          if [ "$WIN_SIGNED" = "true" ]; then
            cat >> notes.md <<'EOF'

          ### Windows

          Double-click `HPC3-Launcher-__VER__-windows-setup.exe`. It installs **per-user, with no
          admin rights and no UAC prompt** — so it works on lab machines you don't administer — and
          adds a Start Menu shortcut and an uninstaller. The installer is Authenticode-signed, so
          SmartScreen stays quiet.
          EOF
          else
            cat >> notes.md <<'EOF'

          ### Windows

          1. Double-click `HPC3-Launcher-__VER__-windows-setup.exe`. It installs **per-user, with no
             admin rights and no UAC prompt** — so it works on lab machines you don't administer —
             and adds a Start Menu shortcut and an uninstaller.
          2. The installer is **not yet code-signed**, so **SmartScreen** may show *"Windows
             protected your PC."* Click **More info → Run anyway**. One time only.

          This warning goes away once Azure Trusted Signing is configured — see
          [`docs/SIGNING.md`](https://github.com/MolloiLab/hpc3-launcher/blob/main/docs/SIGNING.md).
          EOF
          fi

          cat >> notes.md <<'EOF'

          HPC3 Launcher uses Windows' built-in **OpenSSH Client**, which is enabled by default on
          Windows 10 version 1809 and later. If signing in fails with `ssh-keygen not found`, turn it
          on once under **Settings → Apps → Optional features → Add a feature → OpenSSH Client**.

          ### Linux

          ```sh
          sudo dpkg -i HPC3-Launcher-__VER__-linux.deb
          sudo apt-get install -f   # only if dpkg reports missing dependencies
          ```

          Then launch **HPC3 Launcher** from your applications menu, or run
          `/usr/local/bin/HPC3-Launcher`.

          ## First launch

          Sign in with your **UCInetID** and password, then approve the **Duo Push** on your phone.
          The app generates an SSH key (`~/.ssh/<UCInetID>_hpc_app_key`) and installs it on HPC3, so
          every launch after this one connects with no password and no Duo prompt.

          From there: **Job Management** to submit and cancel Slurm jobs, **Node Status** for live
          CPU/memory/GPU usage, **VSCode** to run one or several remote sessions (each writes its own
          `~/.ssh/config` entry, so `Remote-SSH: Connect to Host…` just works), and **Account
          Balance** for your SUs.

          ## Updating

          Use **Help → Check for Updates** inside the app, or download the newer installer from this
          page and install over the top. Your SSH key is kept, so you can sign back in with it
          instead of going through Duo again.

          ## Every installer here was launch-tested

          Before these notes were written, each installer on this page was re-downloaded *from this
          release*, installed the way you would install it, and launched headlessly on macOS, Windows
          and Linux. Each one had to build its full main window and start its Qt event loop. A
          package that can't actually run turns the release red instead of shipping.

          ## Uninstalling

          - **macOS** — drag **HPC3-Launcher** from Applications to the Trash.
          - **Windows** — *Settings → Apps → Installed apps → HPC3 Launcher → Uninstall*.
          - **Linux** — `sudo apt-get remove hpc3-launcher`

          Uninstalling leaves your SSH key and the app's `~/.ssh/config` entries behind. To remove
          those too, delete `~/.ssh/<UCInetID>_hpc_app_key*` and any `HPC3 Launcher VSCode` blocks in
          `~/.ssh/config`.

          ## If something goes wrong

          | Symptom | Cause |
          |---------|-------|
          | "Can't reach HPC3" / "couldn't resolve hpc3.rcic.uci.edu" | Not on the UCI VPN. Connect and retry. |
          | Sign-in hangs after your password | Duo Push is waiting on your phone — approve it. |
          | "HPC3 rejected the key" | The key isn't on the cluster any more. Sign in with your password + Duo to reinstall it. |
          | `ssh-keygen not found` (Windows) | Enable the OpenSSH Client optional feature, above. |

          Anything else — including a bug report — goes to
          [Issues](https://github.com/MolloiLab/hpc3-launcher/issues).
          EOF

          # The guide is written with a literal placeholder so every heredoc can stay
          # quoted: the prose is full of backticks and $ that must not be expanded.
          sed "s/__VER__/$VER/g" notes.md > final.md && mv final.md notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
