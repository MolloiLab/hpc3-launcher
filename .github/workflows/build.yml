name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Push events to tags starting with v (v0.0.1, v1.0.0, etc)
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          
      - name: Build macOS package
        run: |
          # Build directly with PyInstaller (no conda needed on CI)
          python -m PyInstaller --name="HPC3-Launcher" \
            --windowed \
            --add-data="hpc3_launcher/resources:resources" \
            --add-data="hpc3_launcher/modules:modules" \
            --add-data="hpc3_launcher/ui:ui" \
            --hidden-import=pexpect \
            --hidden-import=paramiko \
            --hidden-import=cryptography \
            --hidden-import=bcrypt \
            --hidden-import=PyQt5 \
            --hidden-import=PyQt5.QtWidgets \
            --hidden-import=PyQt5.QtCore \
            --hidden-import=PyQt5.QtGui \
            --hidden-import=requests \
            --hidden-import=packaging \
            --hidden-import=packaging.version \
            --icon="hpc3_launcher/resources/icon.ico" \
            --osx-bundle-identifier="edu.uci.hpc3launcher" \
            "hpc3_launcher/main.py"
          
      - name: Create DMG installer
        run: |
          # Use our new DMG creation script
          python create_dmg.py
          
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            HPC3-Launcher-*.dmg
            dist/HPC3-Launcher.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          
      - name: Build Windows package
        run: |
          # Use PyInstaller directly for now
          python -m PyInstaller --name="HPC3-Launcher" ^
            --windowed ^
            --add-data="hpc3_launcher/resources;resources" ^
            --add-data="hpc3_launcher/modules;modules" ^
            --add-data="hpc3_launcher/ui;ui" ^
            --hidden-import=pexpect ^
            --hidden-import=paramiko ^
            --hidden-import=cryptography ^
            --hidden-import=bcrypt ^
            --hidden-import=PyQt5 ^
            --hidden-import=PyQt5.QtWidgets ^
            --hidden-import=PyQt5.QtCore ^
            --hidden-import=PyQt5.QtGui ^
            --hidden-import=requests ^
            --hidden-import=packaging ^
            --hidden-import=packaging.version ^
            --icon="hpc3_launcher/resources/icon.ico" ^
            "hpc3_launcher/main.py"
          
      - name: Create Windows installer
        run: |
          # Basic ZIP archive for now - can be improved later
          Compress-Archive -Path dist/HPC3-Launcher/* -DestinationPath "HPC3-Launcher-${{ github.ref_name }}-windows.zip"
          
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: HPC3-Launcher-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libgl1-mesa-dev fakeroot
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
          
      - name: Build Linux package
        run: |
          # Use PyInstaller directly
          python -m PyInstaller --name="HPC3-Launcher" \
            --windowed \
            --add-data="hpc3_launcher/resources:resources" \
            --add-data="hpc3_launcher/modules:modules" \
            --add-data="hpc3_launcher/ui:ui" \
            --hidden-import=pexpect \
            --hidden-import=paramiko \
            --hidden-import=cryptography \
            --hidden-import=bcrypt \
            --hidden-import=PyQt5 \
            --hidden-import=PyQt5.QtWidgets \
            --hidden-import=PyQt5.QtCore \
            --hidden-import=PyQt5.QtGui \
            --hidden-import=requests \
            --hidden-import=packaging \
            --hidden-import=packaging.version \
            --icon="hpc3_launcher/resources/icon.ico" \
            "hpc3_launcher/main.py"

      - name: Create Debian package
        run: |
          mkdir -p dist/deb-package/DEBIAN
          mkdir -p dist/deb-package/usr/local/bin
          mkdir -p dist/deb-package/usr/share/applications
          mkdir -p dist/deb-package/usr/share/icons/hicolor/256x256/apps
          
          # Copy executable files
          cp -r dist/HPC3-Launcher/* dist/deb-package/usr/local/bin/

          # Create desktop file
          echo "[Desktop Entry]
          Name=HPC3 Launcher
          Comment=A graphical tool for managing UCI HPC cluster resources
          Exec=/usr/local/bin/HPC3-Launcher
          Icon=/usr/share/icons/hicolor/256x256/apps/hpc3-launcher.png
          Terminal=false
          Type=Application
          Categories=Utility;Science;" > dist/deb-package/usr/share/applications/hpc3-launcher.desktop

          # Copy icon
          cp hpc3_launcher/resources/icon.png dist/deb-package/usr/share/icons/hicolor/256x256/apps/hpc3-launcher.png

          # Create control file
          VERSION=$(echo ${{ github.ref_name }} | sed 's/v//')
          echo "Package: hpc3-launcher
          Version: ${VERSION:-0.0.1}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgl1
          Maintainer: Song Liangyu
          Description: HPC3 Launcher
           A graphical tool for managing UCI HPC cluster resources
           including job management, node status, and VSCode integration." > dist/deb-package/DEBIAN/control

          # Build deb package
          fakeroot dpkg-deb --build dist/deb-package "HPC3-Launcher-${VERSION:-0.0.1}-linux.deb"
          
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: HPC3-Launcher-*.deb

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: HPC3 Launcher ${{ github.ref_name }}
          body_path: RELEASE_NOTES_${{ github.ref_name }}.md
          draft: false
          prerelease: false
          files: |
            artifacts/macos-artifacts/HPC3-Launcher-*.dmg
            artifacts/windows-artifacts/HPC3-Launcher-*.zip
            artifacts/linux-artifacts/HPC3-Launcher-*.deb
            LICENSE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 